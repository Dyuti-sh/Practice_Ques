<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Comic Sans MS', sans-serif; text-align: center; background-color: #f0f8ff; }
        .choices { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }
        button { 
            font-size: 50px; padding: 20px; border-radius: 20px; border: 4px solid #333;
            cursor: pointer; transition: transform 0.2s; background-color: white;
        }
        button:hover { transform: scale(1.1); background-color: #ffeb3b; }
        #result { font-size: 24px; font-weight: bold; margin-top: 20px; color: #2e7d32; }
        .score { font-size: 20px; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>Rock, Paper, Scissors! 🎮</h1>
    <p>Choose your move to play against the computer:</p>

    <div class="choices">
        <button onclick="play('🪨')">🪨</button>
        <button onclick="play('📄')">📄</button>
        <button onclick="play('✂️')">✂️</button>
    </div>

    <div id="result">Waiting for your move...</div>
    <div class="score">Player: <span id="p-score">0</span> | Computer: <span id="c-score">0</span></div>

    <script>
        let pScore = 0;
        let cScore = 0;

        function play(user) {
            const options = ['🪨', '📄', '✂️'];
            const cpu = options[Math.floor(Math.random() * 3)];
            let message = "";

            if (user === cpu) {
                message = `It's a tie! Both chose ${user}`;
            } else if (
                (user === '🪨' && cpu === '✂️') ||
                (user === '📄' && cpu === '🪨') ||
                (user === '✂️' && cpu === '📄')
            ) {
                message = `You Win! ${user} beats ${cpu} 🎉`;
                pScore++;
            } else {
                message = `Computer Wins! ${cpu} beats ${user} 🤖`;
                cScore++;
            }

            document.getElementById('result').innerText = message;
            document.getElementById('p-score').innerText = pScore;
            document.getElementById('c-score').innerText = cScore;
        }
    </script>
</body>
</html>
